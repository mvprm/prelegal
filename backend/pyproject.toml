[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API, which also serves the statically built frontend."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "litellm>=1.106.5",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
# An application, not a library: run from source rather than installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
